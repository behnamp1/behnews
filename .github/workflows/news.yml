name: Behnews Bot Professional

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send news
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          def ask_groq(prompt, system_msg):
              try:
                  resp = requests.post(
                      "https://api.groq.com/openai/v1/chat/completions",
                      headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                      json={
                          "model": "llama-3.3-70b-versatile",
                          "messages": [
                              {"role": "system", "content": system_msg},
                              {"role": "user", "content": prompt}
                          ],
                          "temperature": 0.5
                      }, timeout=30
                  )
                  return resp.json()["choices"][0]["message"]["content"]
              except Exception as e:
                  print(f"Groq Error: {e}")
                  return None

          # 1. جمع‌آوری اخبار
          SOURCES = [("تسنیم", "https://www.tasnimnews.com/fa/rss/feed"), ("ایسنا", "https://www.isna.ir/rss"), ("فارس", "https://www.farsnews.ir/rss")]
          all_news = []
          for name, url in SOURCES:
              try:
                  resp = requests.get(url, timeout=15)
                  titles = re.findall(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', resp.text)
                  clean = lambda t: re.sub(r'<[^>]+>', '', t).strip()
                  valid = [clean(t) for t in titles if len(clean(t)) > 30][1:4]
                  all_news.extend(valid)
              except: continue

          if not all_news:
              print("No news to process.")
              exit()

          # 2. مرحله اول: تولید متن طنز
          raw_funny = ask_groq(
              f"یکی از این خبرا رو انتخاب کن و یه پست طنز لاتی بنویس:\n{all_news[:10]}",
              "تو طنزنویس حرفه‌ای هستی. فقط یک خبر انتخاب کن. تیتر جذاب و زیرش یک پاراگراف صمیمی و محاوره. فقط فارسی!"
          )

          if not raw_funny:
              print("Failed to generate funny text.")
              exit()

          # 3. مرحله دوم: بازبینی خودکار
          refined = ask_groq(
              f"این متن رو اصلاح کن (کلمات انگلیسی حذف، لحن صمیمی، پیروز و شکست‌خورده جابجا نشوند):\n{raw_funny}",
              "سردبیر سخت‌گیر. فقط متن اصلاح شده را برگردان. بدون کلمات اضافه."
          )

          final_msg = refined if refined else raw_funny

          # 4. ارسال به بله
          r = requests.post(
              f"https://tapi.bale.ai/bot{TOKEN}/sendMessage",
              json={"chat_id": int(CHAT), "text": f"{final_msg}\n\n🆔 @behnews"}
          )
          print(f"Bale Response: {r.json()}")
          PYEOF
