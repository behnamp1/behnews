name: Behnews Bot Fast Iran Final

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send Fast News
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re, random

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          def clean_latin(text):
              # حذف هر نوع کاراکتر انگلیسی یا لاتین باقی‌مانده
              return re.sub(r'[a-zA-Záéíóúýčďěňřšťžů]+', '', text).strip()

          SOURCES = [
              "https://www.tasnimnews.com/fa/rss/feed/0/7/1",
              "https://www.isna.ir/rss/tp/1",
              "https://www.irna.ir/rss/tp/1",
              "https://www.farsnews.ir/rss/politics"
          ]

          all_news = []
          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=10)
                  items = re.findall(r'<item>(.*?)</item>', resp.text, re.DOTALL)
                  for item in items:
                      title = re.search(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', item).group(1)
                      img_match = re.search(r'<(?:enclosure|media:content).*?url="(.*?)"', item)
                      img_url = img_match.group(1) if img_match else None
                      if len(title) > 30:
                          all_news.append({"title": title, "image": img_url})
              except: continue

          if not all_news: exit()
          selected = all_news[0]
          
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system", 
                              "content": (
                                  "تو ادمین یک کانال خبری هستی. فقط و فقط به زبان فارسی سره و محاوره بنویس. "
                                  "حتی یک کلمه انگلیسی یا لاتین (مثل pro-ble-my) نباید در متن باشد. "
                                  "فرمت: 📍 تیتر جذاب / 💬 خبر محاوره / تیکه ادمین: لاتی و رند. "
                                  "فقط درباره اخبار ایران بنویس و به دشمنان ایران تیکه بینداز."
                              )
                          },
                          {"role": "user", "content": f"این خبر رو با زبان لاتی و صمیمی طنز کن (بدون حتی یک کلمه لاتین): {selected['title']}"}
                      ],
                      "temperature": 0.4 # کم کردن دما برای دقت بیشتر در رعایت قوانین
                  }, timeout=30
              ).json()
              msg = groq["choices"][0]["message"]["content"]
              msg = clean_latin(msg) # لایه امنیتی نهایی
          except: exit()

          caption = f"{msg}\n\n🆔 @behnews"

          if selected['image'] and "static" not in selected['image'] and "logo" not in selected['image']:
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendPhoto", json={"chat_id": int(CHAT), "photo": selected['image'], "caption": caption})
          else:
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": caption})
          PYEOF
