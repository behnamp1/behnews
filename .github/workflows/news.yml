name: Behnews Bot Ultra Stable

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send Post
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          def super_clean(text):
              # حذف هر چیزی که الفبای فارسی یا عدد یا علائم نگارشی استاندارد نیست
              # این کاراکترهای چینی و لاتین رو کاملا فیلتر میکنه
              cleaned = re.sub(r'[^آ-ی‌أإؤئء۰-۹0-9\s📍💬🆔@\.\!\?\:\(\)\-\_]', '', text)
              # حذف تیکه ادمین اگر باز هم اصرار داشت بنویسه
              cleaned = re.sub(r'تیکه ادمین.*', '', cleaned, flags=re.DOTALL)
              return cleaned.strip()

          SOURCES = ["https://www.isna.ir/rss", "https://www.tasnimnews.com/fa/rss/feed", "https://www.irna.ir/rss"]
          
          news_list = []
          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=10)
                  items = re.findall(r'<item>(.*?)</item>', resp.text, re.DOTALL)
                  for item in items[:3]:
                      title = re.search(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', item).group(1)
                      img = re.search(r'<(?:enclosure|media:content).*?url="(.*?)"', item)
                      img_url = img.group(1) if img else None
                      news_list.append({"t": title, "i": img_url})
              except: continue

          if not news_list: exit()
          selected = news_list[0]

          # استفاده از مدل Mixtral برای پایداری بیشتر در زبان فارسی
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "mixtral-8x7b-32768",
                      "messages": [
                          {"role": "system", "content": "تو یک کاربرِ رِند و شوخ در توییتر فارسی هستی. خبر را خیلی کوتاه و با زبان محاوره تهرانی بازنویسی کن. فقط فارسی بنویس. فرمت: 📍 [تیتر] و در سطر بعد 💬 [متن محاوره]. تیکه ادمین ننویس."},
                          {"role": "user", "content": f"این خبر رو خیلی کوتاه و صمیمی تعریف کن: {selected['t']}"}
                      ],
                      "temperature": 0.3
                  }
              ).json()
              msg = super_clean(groq["choices"][0]["message"]["content"])
          except: exit()

          full_caption = f"{msg}\n\n🆔 @behnews"

          if selected['i'] and "logo" not in selected['i']:
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendPhoto", json={"chat_id": int(CHAT), "photo": selected['i'], "caption": full_caption})
          else:
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": full_caption})
          PYEOF
