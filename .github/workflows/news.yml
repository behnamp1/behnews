name: Behnews Bot Professional Iran

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send Post
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          def final_clean(text):
              # حذف حروف انگلیسی و کاراکترهای عجیب چینی/لاتین
              text = re.sub(r'[a-zA-Záéíóúýčďěňřšťžů]+', '', text)
              # پاکسازی کاراکترهای خاص غیرضروری
              text = re.sub(r'[^\u0600-\u06FF0-9\s📍💬🆔@\.\!\?\:\(\)\-\_]', '', text)
              return text.strip()

          SOURCES = ["https://www.isna.ir/rss", "https://www.tasnimnews.com/fa/rss/feed", "https://www.irna.ir/rss"]
          
          news_list = []
          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=10)
                  items = re.findall(r'<item>(.*?)</item>', resp.text, re.DOTALL)
                  for item in items[:3]:
                      title = re.search(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', item).group(1)
                      img = re.search(r'<(?:enclosure|media:content).*?url="(.*?)"', item)
                      img_url = img.group(1) if img else None
                      news_list.append({"t": title, "i": img_url})
              except: continue

          if not news_list: exit()
          selected = news_list[0]

          system_prompt = (
              "تو ادمین یک کانال خبری رند و صمیمی هستی. "
              "وظیفه: خبر رو به زبان محاوره تهرانی و با لحن کنایه‌آمیز بنویس. "
              "فرمت خروجی دقیقا این باشد:\n"
              "📍 [یک تیتر خلاقانه و کوتاه]\n\n"
              "💬 [توضیح خبر به زبان صمیمی و طنز در حداکثر دو جمله]\n\n"
              "قوانین: فقط فارسی. کلمه انگلیسی اصلا استفاده نکن. تیکه ادمین جداگانه ننویس."
          )
          
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {"role": "system", "content": system_prompt},
                          {"role": "user", "content": f"این خبر ایران رو با فرمت بالا طنز کن: {selected['t']}"}
                      ],
                      "temperature": 0.4
                  }
              ).json()
              msg = groq["choices"][0]["message"]["content"]
              msg = final_clean(msg)
          except: exit()

          full_caption = f"{msg}\n\n🆔 @behnews"

          if selected['i'] and "logo" not in selected['i']:
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendPhoto", json={"chat_id": int(CHAT), "photo": selected['i'], "caption": full_caption})
          else:
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": full_caption})
          PYEOF
