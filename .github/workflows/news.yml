name: Behnews Bot Professional

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send news
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          SOURCES = [
              ("تسنیم",    "https://www.tasnimnews.com/fa/rss/feed"),
              ("ایسنا",    "https://www.isna.ir/rss"),
              ("فارس",     "https://www.farsnews.ir/rss"),
              ("خبرآنلاین", "https://www.khabaronline.ir/rss"),
          ]

          all_news = []
          for name, url in SOURCES:
              try:
                  resp = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=10)
                  titles = re.findall(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', resp.text)
                  clean = lambda t: re.sub(r'<[^>]+>', '', t).strip()
                  valid = [clean(t) for t in titles if len(clean(t)) > 30][1:4]
                  all_news.extend(valid)
              except: continue

          if not all_news: exit()

          news_block = "\n- ".join(all_news[:12])
          
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system", 
                              "content": (
                                  "تو یه طنزنویسِ رِند و خفنِ توییتر فارسی هستی. "
                                  "وظیفه‌ات اینه: از بین خبرهایی که بهت داده میشه، فقط 'یک دونه' که از همه سوژه تره رو انتخاب کنی. "
                                  "قوانین خیلی مهم: "
                                  "۱. لحنت باید کاملاً صمیمی، لاتی و محاوره باشه (بگو 'هست'، 'شد'، 'چی میگه؟'). "
                                  "۲. تیتر باید خیلی کوتاه، بمب و با ایموجی باشه. "
                                  "۳. متن پست حداکثر ۲ جمله باشه. "
                                  "۴. اصلاً و ابداً از کلمات انگلیسی، لاتین یا فینگلیش استفاده نکن. "
                                  "۵. حواست باشه کی به کیه! اگه ایران کاری کرده، به رقیب تیکه بنداز، نه به خودمون. "
                                  "۶. شوخی لوس نکن، جوری بنویس که انگار داری واسه رفیقت تیکه میندازی."
                              )
                          },
                          {"role": "user", "content": f"این خبرا رو ببین، یکیشو که از همه ضایع‌تر یا مهم‌تره انتخاب کن و یه پست مشتی بساز:\n\n{news_block}"}
                      ],
                      "temperature": 0.7 # برای اینکه متن‌ها تکراری نشن
                  }, timeout=30
              ).json()
              msg = groq["choices"][0]["message"]["content"]
          except: exit()

          # ارسال نهایی
          requests.post(
              f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", 
              json={"chat_id": int(CHAT), "text": f"{msg}\n\n🆔 @behnews"}
          )
          PYEOF
