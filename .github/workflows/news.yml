name: Behnews Bot Fast & Official

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *' # هر ۵ دقیقه چک می‌کند

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Process News
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]
          HISTORY_FILE = "sent_news.txt"

          # مدیریت فایل تاریخچه برای جلوگیری از ارسال تکراری
          if not os.path.exists(HISTORY_FILE):
              with open(HISTORY_FILE, "w") as f: f.write("")
          
          with open(HISTORY_FILE, "r") as f:
              sent_titles = set(f.read().splitlines())

          SOURCES = [
              "https://www.tasnimnews.com/fa/rss/feed/0/7/1",
              "https://www.irna.ir/rss/tp/1",
              "https://www.isna.ir/rss/tp/1",
              "https://www.farsnews.ir/rss/politics"
          ]

          all_news = []
          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=10)
                  items = re.findall(r'<item>(.*?)</item>', resp.text, re.DOTALL)
                  for item in items:
                      title = re.search(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', item).group(1)
                      title = re.sub(r'<[^>]+>', '', title).strip()
                      if title not in sent_titles and len(title) > 30:
                          all_news.append(title)
              except: continue

          if not all_news:
              print("خبر جدیدی پیدا نشد.")
              exit(0)

          # انتخاب جدیدترین خبر
          new_title = all_news[0]

          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {"role": "system", "content": "تو یک ویراستار خبر رسمی هستی. خبر زیر را فقط در یک جمله کوتاه، رسمی و بدون هیچ طنز یا کنایه‌ای خلاصه کن. فقط فارسی بنویس."},
                          {"role": "user", "content": f"خلاصه کن: {new_title}"}
                      ],
                      "temperature": 0.1
                  }
              ).json()
              summary = groq["choices"][0]["message"]["content"].strip()
          except Exception as e:
              print(f"Error in Groq: {e}")
              summary = "مشروح خبر در خبرگزاری‌های رسمی."

          # متن نهایی
          post_content = f"📍 {new_title}\n\n🔹 {summary}\n\n🆔 @behnews"
          
          # ارسال به بله
          resp = requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": post_content})
          
          if resp.status_code == 200:
              with open(HISTORY_FILE, "a") as f:
                  f.write(new_title + "\n")
          PYEOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "NewsBot"
          git config --global user.email "bot@github.com"
          git add sent_news.txt
          git commit -m "Update history" || exit 0
          git push
