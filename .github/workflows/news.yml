name: Behnews Bot Professional

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send news
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re
          from datetime import datetime

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          SOURCES = [
              ("تسنیم",    "https://www.tasnimnews.com/fa/rss/feed"),
              ("ایسنا",    "https://www.isna.ir/rss"),
              ("فارس",     "https://www.farsnews.ir/rss"),
              ("خبرآنلاین", "https://www.khabaronline.ir/rss"),
          ]

          all_news = []
          for name, url in SOURCES:
              try:
                  resp = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=10)
                  titles = re.findall(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', resp.text)
                  clean = lambda t: re.sub(r'<[^>]+>', '', t).strip()
                  valid = [clean(t) for t in titles if len(clean(t)) > 30][1:4]
                  all_news.extend(valid)
              except: continue

          if not all_news: exit()

          news_block = "\n".join(all_news[:10])
          
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system", 
                              "content": (
                                  "تو یک طنزنویس حرفه‌ای توییتر فارسی هستی که اخبار رو با زبون تند و تیز و صمیمی نقد می‌کنه. "
                                  "وظیفه: از بین خبرهایی که بهت داده میشه، فقط و فقط 'یک' خبر که از همه مهم‌تر یا عجیب‌تره رو انتخاب کن. "
                                  "فرمت خروجی: "
                                  "سطر اول: یک تیتر کوتاه و خیلی جذاب (با ایموجی). "
                                  "سطر دوم: یک پاراگراف کوتاه (حداکثر ۲ جمله) با لحن کاملاً عامیانه، صمیمی و تیکه‌دار. "
                                  "قوانین سخت‌گیرانه: "
                                  "۱- فقط فارسی بنویس. حق استفاده از حتی یک کلمه انگلیسی یا لاتین رو نداری. "
                                  "۲- از کلماتی مثل 'می‌باشد' یا 'است' استفاده نکن؛ بگو 'هست'، 'شده'، 'یه جوریه'. "
                                  "۳- شوخی باید هوشمندانه باشه، نه لوس. "
                                  "۴- فقط یک خبر رو پست کن."
                              )
                          },
                          {"role": "user", "content": f"این خبرا رو بخون، بهترینش رو انتخاب کن و یه پست مشتی بساز:\n\n{news_block}"}
                      ]
                  }, timeout=30
              ).json()
              msg = groq["choices"][0]["message"]["content"]
          except: exit()

          final_msg = f"{msg}\n\n🆔 @behnews"

          requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": final_msg})
          PYEOF
