name: Behnews Bot Professional

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send news with Photo
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          SOURCES = [
              ("تسنیم", "https://www.tasnimnews.com/fa/rss/feed"),
              ("ایسنا", "https://www.isna.ir/rss"),
              ("فارس", "https://www.farsnews.ir/rss"),
              ("خبرآنلاین", "https://www.khabaronline.ir/rss"),
          ]

          all_news = []
          for name, url in SOURCES:
              try:
                  resp = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=10)
                  # استخراج آیتم‌های خبر
                  items = re.findall(r'<item>(.*?)</item>', resp.text, re.DOTALL)
                  for item in items[:5]:
                      title = re.search(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', item).group(1)
                      # تلاش برای پیدا کردن لینک عکس در تگ‌های مختلف
                      img_match = re.search(r'<enclosure.*?url="(.*?)"', item) or re.search(r'<media:content.*?url="(.*?)"', item) or re.search(r'src="(.*?)"', item)
                      img_url = img_match.group(1) if img_match else None
                      
                      if len(title) > 30:
                          all_news.append({"title": title, "image": img_url})
              except: continue

          if not all_news: exit()

          # انتخاب یک خبر تصادفی از لیست برای تنوع
          import random
          selected = random.choice(all_news[:10])
          
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system", 
                              "content": (
                                  "تو ادمین یک کانال خبری هستی. "
                                  "فرمت خروجی دقیقا این باشد:\n"
                                  "📍 [تیتر کوتاه خبر]\n\n"
                                  "💬 [اصل خبر به زبان محاوره]\n\n"
                                  "تیکه ادمین: [یک جمله کوتاه، کنایه‌آمیز و رندانه]\n\n"
                                  "قوانین: فقط فارسی، صمیمی، بدون کلمه انگلیسی."
                              )
                          },
                          {"role": "user", "content": f"این خبر را با فرمت گفته شده بساز: {selected['title']}"}
                      ]
                  }, timeout=30
              ).json()
              msg = groq["choices"][0]["message"]["content"]
          except: exit()

          caption = f"{msg}\n\n🆔 @behnews"

          # اگر عکس داشت، با عکس بفرست، وگرنه فقط متن
          if selected['image']:
              r = requests.post(
                  f"https://tapi.bale.ai/bot{TOKEN}/sendPhoto",
                  json={"chat_id": int(CHAT), "photo": selected['image'], "caption": caption}
              )
          else:
              r = requests.post(
                  f"https://tapi.bale.ai/bot{TOKEN}/sendMessage",
                  json={"chat_id": int(CHAT), "text": caption}
              )
          print(r.json())
          PYEOF
