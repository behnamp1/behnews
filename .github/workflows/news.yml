name: Behnews Bot Final Professional

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # اضافه کردن توکن برای اجازه دسترسی

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Process News
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]
          HISTORY_FILE = "sent_news.txt"

          if not os.path.exists(HISTORY_FILE):
              open(HISTORY_FILE, "w").close()
          
          with open(HISTORY_FILE, "r") as f:
              sent_titles = set(f.read().splitlines())

          SOURCES = [
              "https://www.tasnimnews.com/fa/rss/feed/0/7/1",
              "https://www.irna.ir/rss/tp/1",
              "https://www.isna.ir/rss/tp/1",
              "https://www.farsnews.ir/rss/politics"
          ]

          all_news = []
          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=10)
                  items = re.findall(r'<item>(.*?)</item>', resp.text, re.DOTALL)
                  for item in items:
                      title = re.search(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', item).group(1)
                      title = re.sub(r'<[^>]+>', '', title).strip()
                      img_match = re.search(r'<(?:enclosure|media:content).*?url="(.*?)"', item)
                      img_url = img_match.group(1) if img_match else None
                      
                      if title not in sent_titles and len(title) > 35:
                          all_news.append({"title": title, "image": img_url})
              except: continue

          if not all_news:
              print("خبر جدیدی نیست.")
              exit(0)
          
          selected = all_news[0]

          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system", 
                              "content": "تو سردبیر خبر هستی. خبر را به زبان محاوره رسمی و کوتاه خلاصه کن. فرمت: سطر اول تیتر با 📍 / سطر دوم متن با 💬. بدون کلمه انگلیسی و بدون عبارت تیکه ادمین."
                          },
                          {"role": "user", "content": f"این خبر را آماده کن: {selected['title']}"}
                      ],
                      "temperature": 0.2
                  }, timeout=30
              ).json()
              msg = groq["choices"][0]["message"]["content"]
              msg = re.sub(r'[a-zA-Z]+', '', msg).strip()
          except: exit(0)

          final_text = f"{msg}\n\n🆔 @behnews"

          if selected['image'] and "logo" not in selected['image']:
              r = requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendPhoto", json={"chat_id": int(CHAT), "photo": selected['image'], "caption": final_text})
          else:
              r = requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": final_text})

          if r.status_code == 200:
              with open(HISTORY_FILE, "a") as f:
                  f.write(selected['title'] + "\n")
          PYEOF

      - name: Save History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_news.txt
          git commit -m "Update sent news history" || exit 0
          git push
