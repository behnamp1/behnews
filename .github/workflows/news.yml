name: Behnews Bot Standard

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send news
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          # منابع رسمی
          SOURCES = ["https://www.irna.ir/rss/", "https://www.isna.ir/rss", "https://www.tasnimnews.com/fa/rss/feed"]
          
          all_titles = []
          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=10)
                  titles = re.findall(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', resp.text)
                  for t in titles[1:4]:
                      clean_t = re.sub(r'<[^>]+>', '', t).strip()
                      if len(clean_t) > 25: all_titles.append(clean_t)
              except: continue

          if not all_titles: exit()

          # ارسال به Groq با دستور اکید
          news_block = "\n- ".join(all_titles[:10])
          
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system", 
                              "content": (
                                  "تو یک طنزنویس لاتی و رند تهرانی هستی. "
                                  "فقط یک خبر جذاب از لیست انتخاب کن. "
                                  "یک تیتر مشتی بزن و زیرش یک پاراگراف کوتاه (۲ جمله) طنز بنویس. "
                                  "قوانین قرمز: ۱- کلمه انگلیسی ممنوع. ۲- کتابی حرف نزن (بگو هست، شد، می‌گه). "
                                  "۳- حواست باشه کی به کیه! اگه ایران برده، ضایع‌اش نکن، به رقیب تیکه بنداز. "
                                  "۴- ایموجی باحال یادت نره."
                              )
                          },
                          {"role": "user", "content": f"این خبرا رو بگیر و فقط یکیشو بترکون:\n\n{news_block}"}
                      ],
                      "temperature": 0.7
                  }, timeout=30
              ).json()
              msg = groq["choices"][0]["message"]["content"]
          except: exit()

          # ارسال نهایی
          requests.post(
              f"https://tapi.bale.ai/bot{TOKEN}/sendMessage",
              json={"chat_id": int(CHAT), "text": f"{msg}\n\n🆔 @behnews"}
          )
          PYEOF
