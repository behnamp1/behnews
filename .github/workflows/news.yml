name: Behnews Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send news
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          # لیست منابع (همونایی که خودت داشتی)
          SOURCES = [
              "https://www.tasnimnews.com/fa/rss/feed",
              "https://www.isna.ir/rss",
              "https://www.farsnews.ir/rss",
              "https://www.khabaronline.ir/rss"
          ]

          all_news = []
          for url in SOURCES:
              try:
                  resp = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=10)
                  titles = re.findall(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', resp.text)
                  clean = lambda t: re.sub(r'<[^>]+>', '', t).strip()
                  valid = [clean(t) for t in titles if len(clean(t)) > 30][1:4]
                  all_news.extend(valid)
              except: continue

          if not all_news: exit()

          try:
              # دقیقاً همون درخواستی که قبلاً برات کار می‌کرد
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system", 
                              "content": "تو ادمین شوخ یک کانال خبری هستی. فقط یک خبر انتخاب کن. فرمت: سطر اول تیتر با 📍، سطر دوم متن محاوره با 💬. فقط فارسی بنویس. کلمه انگلیسی و بخش 'تیکه ادمین' ممنوع."
                          },
                          {"role": "user", "content": f"این خبرا رو بگیر و فقط یکیشو بترکون:\n\n{all_news[:8]}"}
                      ],
                      "temperature": 0.5
                  }, timeout=30
              ).json()
              msg = groq["choices"][0]["message"]["content"]
              
              # اصلاحیه نهایی: حذف هرچیزی که فارسی نیست (مثل کلمات لاتین)
              msg = re.sub(r'[a-zA-Z]+', '', msg) 
              msg = msg.replace("تیکه ادمین:", "").strip()

          except: exit()

          final_msg = f"{msg}\n\n🆔 @behnews"

          # ارسال به بله
          requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": final_msg})
          PYEOF
