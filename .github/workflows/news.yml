name: Behnews Bot Final Fix

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send Post
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          def clean_text(text):
              # فقط حذف حروف انگلیسی برای جلوگیری از سوتی‌هایی مثل besar
              text = re.sub(r'[a-zA-Z]+', '', text)
              # حذف خطوط اضافی احتمالی که هوش مصنوعی میسازه
              text = text.replace('تیکه ادمین:', '').replace('📍', '').replace('💬', '')
              return text.strip()

          SOURCES = ["https://www.isna.ir/rss/tp/1", "https://www.tasnimnews.com/fa/rss/feed/0/7/1"]
          
          news_list = []
          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=15)
                  items = re.findall(r'<item>(.*?)</item>', resp.text, re.DOTALL)
                  for item in items[:2]:
                      title = re.search(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', item).group(1)
                      img = re.search(r'<(?:enclosure|media:content).*?url="(.*?)"', item)
                      img_url = img.group(1) if img else None
                      news_list.append({"t": title, "i": img_url})
              except: continue

          if not news_list: exit()
          selected = news_list[0]

          try:
              # درخواست فقط برای "توضیح طنز"
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {"role": "system", "content": "تو یک رفیق شوخ هستی. خبر زیر را فقط در یک یا دو جمله به زبان محاوره تهرانی و خیلی صمیمی و تیکه‌دار تعریف کن. اصلا انگلیسی ننویس و تیتر هم نزن."},
                          {"role": "user", "content": f"این خبر رو خیلی کوتاه و صمیمی تعریف کن: {selected['t']}"}
                      ],
                      "temperature": 0.4
                  }
              ).json()
              funny_part = clean_text(groq["choices"][0]["message"]["content"])
          except: exit()

          # ساختار پیام رو اینجا خودم دستی میچینم که هوش مصنوعی خرابش نکنه
          full_caption = f"📍 **{selected['t']}**\n\n💬 {funny_part}\n\n🆔 @behnews"

          if selected['i'] and "logo" not in selected['i']:
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendPhoto", json={"chat_id": int(CHAT), "photo": selected['i'], "caption": full_caption})
          else:
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": full_caption})
          PYEOF
