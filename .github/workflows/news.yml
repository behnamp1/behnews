name: Behnews Bot Professional

on:
  schedule:
    - cron: '*/30 * * * *' # هر 30 دقیقه
  workflow_dispatch: # اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4 # این خط اصلاح شد
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Fetch and Post News
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<EOF
          import requests
          import feedparser
          import os

          RSS_URLS = [
              "https://www.isna.ir/rss",
              "https://www.irna.ir/rss",
              "https://www.mehrnews.com/rss",
              "https://www.tasnimnews.com/fa/rss/feed/0/7/1",
              "https://www.farsnews.ir/rss"
          ]

          def get_latest_news():
              all_news = []
              for url in RSS_URLS:
                  try:
                      feed = feedparser.parse(url)
                      for entry in feed.entries[:2]: 
                          all_news.append(f"خبر: {entry.title}")
                  except:
                      continue
              return "\n\n".join(all_news[:10])

          def process_with_groq(news_text):
              url = "https://api.groq.com/openai/v1/chat/completions"
              headers = {
                  "Authorization": f"Bearer {os.getenv('GROQ_API_KEY')}",
                  "Content-Type": "application/json"
              }
              prompt = f"این خبرها رو به زبان فارسی خیلی طنز، عامیانه و با لحن شوخ بازنویسی کن. برای هر خبر یک پاراگراف کوتاه بنویس و بین خبرها دو تا خط فاصله (اینتر) بذار تا متن‌ها توی هم نرن. آخر هر بخش هم ایموجی مرتبط بذار:\n\n{news_text}"
              
              data = {
                  "model": "llama3-8b-8192",
                  "messages": [{"role": "user", "content": prompt}]
              }
              response = requests.post(url, headers=headers, json=data)
              return response.json()['choices'][0]['message']['content']

          def send_to_bale(text):
              url = f"https://tapi.bale.ai/bot{os.getenv('BALE_TOKEN')}/sendMessage"
              data = {
                  "chat_id": os.getenv("CHANNEL_ID"),
                  "text": f"🔔 **نیم‌ساعت اخیر چی شده؟**\n\n{text}\n\n🆔 @Behnews"
              }
              requests.post(url, json=data)

          try:
              raw_news = get_latest_news()
              if raw_news:
                  funny_news = process_with_groq(raw_news)
                  send_to_bale(funny_news)
              print("Done!")
          except Exception as e:
              print(f"Error: {e}")
          EOF
