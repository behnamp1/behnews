name: Behnews Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send news
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re
          from datetime import datetime

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          # منابع رسمی با اولویت اخبار ایران
          SOURCES = [
              ("ایرنا",    "https://www.irna.ir/rss/"),
              ("ایسنا",    "https://www.isna.ir/rss"),
              ("تسنیم",    "https://www.tasnimnews.com/fa/rss/feed"),
              ("فارس",     "https://www.farsnews.ir/rss"),
              ("مهر",      "https://www.mehrnews.com/rss"),
          ]

          all_news = []

          for name, url in SOURCES:
              try:
                  resp = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=10)
                  rss = resp.text
                  titles = re.findall(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', rss)
                  
                  def clean(t):
                      return re.sub(r'<[^>]+>', '', t).strip()

                  # انتخاب خبرهای واقعی (فیلتر کردن عناوین تکراری سایت)
                  valid_titles = [clean(t) for t in titles if len(clean(t)) > 25][1:4]
                  for title in valid_titles:
                      all_news.append(f"[{name}] {title}")
              except:
                  continue

          if not all_news:
              exit()

          # ارسال به Groq با دستورالعمل طنز خلاقانه و کوتاه
          news_block = "\n".join(all_news[:10])
          
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system", 
                              "content": (
                                  "تو یک طنزپرداز حرفه‌ای و رند ایرانی هستی. "
                                  "باید اخبار جدی رو به صورت خیلی کوتاه، کنایه‌آمیز و خلاقانه بازنویسی کنی. "
                                  "قوانین: 1- یک تیتر جذاب و کوتاه برای کل پست بنویس. "
                                  "2- هر خبر رو در حداکثر یک یا دو جمله طنز کن. "
                                  "3- بین هر خبر فاصله بذار. "
                                  "4- لحن عصبی یا لوس نباشه، رند و بامزه باشه. "
                                  "5- اولویت با سوژه‌های اجتماعی و اقتصادی ایران باشه."
                              )
                          },
                          {"role": "user", "content": f"این اخبار رو بردار و یه پست طنز مشتی بساز:\n\n{news_block}"}
                      ],
                      "max_tokens": 1000
                  }, timeout=30
              ).json()
              msg = groq["choices"][0]["message"]["content"]
          except:
              msg = "هوش مصنوعی‌مون رفته چای بخوره، برمی‌گرده!"

          # ظاهر نهایی پست
          final_msg = f"🗞 **یه خبرایی هست...**\n\n{msg}\n\n🆔 @behnews"

          # ارسال به بله
          requests.post(
              f"https://tapi.bale.ai/bot{TOKEN}/sendMessage",
              json={"chat_id": int(CHAT), "text": final_msg}
          )
          PYEOF
