name: Behnews Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send news
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re, time
          from datetime import datetime

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          SOURCES = [
              ("ایرنا",    "https://www.irna.ir/rss/"),
              ("ایسنا",    "https://www.isna.ir/rss"),
              ("مهر",      "https://www.mehrnews.com/rss"),
              ("فارس",     "https://www.farsnews.ir/rss"),
              ("تسنیم",    "https://www.tasnimnews.com/fa/rss/feed"),
              ("باشگاه",   "https://www.bnn.ir/rss"),
          ]

          all_news = []

          for name, url in SOURCES:
              try:
                  resp = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=10)
                  rss = resp.text

                  # استخراج عنوان و توضیح
                  titles = re.findall(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', rss)
                  descs  = re.findall(r'<description>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</description>', rss)

                  # پاک کردن تگ‌های HTML
                  def clean(t):
                      t = re.sub(r'<[^>]+>', '', t).strip()
                      return t

                  titles = [clean(t) for t in titles if len(clean(t)) > 15][1:3]
                  descs  = [clean(d) for d in descs  if len(clean(d)) > 15][1:3]

                  for i, title in enumerate(titles):
                      desc = descs[i] if i < len(descs) else ""
                      all_news.append({
                          "source": name,
                          "title": title,
                          "desc": desc[:150] if desc else ""
                      })

              except Exception as e:
                  print(f"Error {name}: {e}")
                  continue

          if not all_news:
              print("No news")
              exit()

          # ساخت متن خبرها برای Groq
          news_block = ""
          for n in all_news[:6]:
              news_block += f"[{n['source']}] {n['title']}"
              if n['desc']:
                  news_block += f" - {n['desc']}"
              news_block += "\n"

          # ارسال به Groq برای نوشتن پست طنز
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={
                      "Authorization": f"Bearer {GROQ_KEY}",
                      "Content-Type": "application/json"
                  },
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system",
                              "content": (
                                  "تو نویسنده طنز یه کانال خبری ایرانی هستی.\n"
                                  "وظیفه‌ات اینه که اخبار جدی رو به شکل طنز و کنایه‌دار بنویسی.\n"
                                  "قوانین نوشتن:\n"
                                  "- هر خبر رو جداگانه در یه پاراگراف بنویس\n"
                                  "- بین هر خبر یه خط خالی بذار\n"
                                  "- هر پاراگراف با یه ایموجی مرتبط شروع بشه\n"
                                  "- لحن: طنز، کنایه، بامزه ولی محترمانه\n"
                                  "- در انتها یه جمله طنز جمع‌بندی بنویس\n"
                                  "- فقط فارسی بنویس"
                              )
                          },
                          {
                              "role": "user",
                              "content": f"این اخبار الان ایرانه، پست کانال بنویس:\n\n{news_block}"
                          }
                      ],
                      "max_tokens": 800
                  },
                  timeout=30
              ).json()

              msg = groq["choices"][0]["message"]["content"]

          except Exception as e:
              msg = f"⚠️ خطا: {e}"

          # ارسال به بله
          now = datetime.now().strftime("%H:%M - %Y/%m/%d")
          final_msg = f"📰 اخبار ایران | {now}\n\n{msg}\n\n🔔 @behnews"

          r = requests.post(
              f"https://tapi.bale.ai/bot{TOKEN}/sendMessage",
              json={"chat_id": int(CHAT), "text": final_msg},
              timeout=15
          )
          print(r.json())
          PYEOF
