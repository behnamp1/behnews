name: Behnews Bot Professional

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send news
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          SOURCES = [
              ("تسنیم", "https://www.tasnimnews.com/fa/rss/feed"),
              ("ایسنا", "https://www.isna.ir/rss"),
              ("فارس", "https://www.farsnews.ir/rss"),
              ("خبرآنلاین", "https://www.khabaronline.ir/rss"),
          ]

          all_news = []
          for name, url in SOURCES:
              try:
                  resp = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=10)
                  titles = re.findall(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', resp.text)
                  clean = lambda t: re.sub(r'<[^>]+>', '', t).strip()
                  valid = [clean(t) for t in titles if len(clean(t)) > 30][1:4]
                  all_news.extend(valid)
              except: continue

          if not all_news: exit()
          news_block = "\n- ".join(all_news[:12])
          
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system", 
                              "content": (
                                  "تو ادمین یک کانال خبری تند و تیز هستی. "
                                  "وظیفه: جذاب‌ترین خبر را انتخاب کن. "
                                  "فرمت ارسال دقیقا مثل این باشد:\n"
                                  "📍 [تیتر کوتاه خبر]\n\n"
                                  "💬 [اصل خبر یا نقل‌قول مهم به زبان محاوره]\n\n"
                                  "تیکه ادمین: [یک جمله کوتاه، کنایه‌آمیز و بسیار رندانه به زبان لاتی/محاوره]\n\n"
                                  "قوانین: فقط فارسی، بدون کلمه انگلیسی، لحن کاملا صمیمی و تیکه‌دار."
                              )
                          },
                          {"role": "user", "content": f"از این خبرا یکی رو با فرمت گفته شده بساز:\n\n{news_block}"}
                      ],
                      "temperature": 0.8
                  }, timeout=30
              ).json()
              msg = groq["choices"][0]["message"]["content"]
          except: exit()

          requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": f"{msg}\n\n🆔 @behnews"})
          PYEOF
