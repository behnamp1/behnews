name: Behnews Bot Professional

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send news
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re
          from datetime import datetime

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          SOURCES = [
              ("ایرنا",    "https://www.irna.ir/rss/"),
              ("ایسنا",    "https://www.isna.ir/rss"),
              ("تسنیم",    "https://www.tasnimnews.com/fa/rss/feed"),
              ("فارس",     "https://www.farsnews.ir/rss"),
              ("مهر",      "https://www.mehrnews.com/rss"),
          ]

          all_news = []
          for name, url in SOURCES:
              try:
                  resp = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=10)
                  titles = re.findall(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', resp.text)
                  clean = lambda t: re.sub(r'<[^>]+>', '', t).strip()
                  valid = [clean(t) for t in titles if len(clean(t)) > 25][1:3]
                  all_news.extend(valid)
              except: continue

          if not all_news: exit()

          news_block = "\n- ".join(all_news[:8])
          
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system", 
                              "content": (
                                  "تو یک طنزپرداز رند و صمیمی هستی. اخبار زیر را بخوان و اینگونه خروجی بده:\n"
                                  "1. اول از همه، بر اساس مهم‌ترین یا عجیب‌ترین خبر، یک تیتر خیلی کوتاه، جذاب و عامیانه بنویس که بین دو تا ستاره باشه (مثلا: **فلان چیز گرون شد رفت!**).\n"
                                  "2. بعد از تیتر، دو تا اینتر بزن.\n"
                                  "3. هر خبر را در یک پاراگراف جداگانه، با لحن کاملاً صمیمی، تهرانی محاوره و خلاقانه بنویس.\n"
                                  "4. هر پاراگراف حتماً با یک ایموجی مرتبط با موضوع شروع شود.\n"
                                  "5. بین پاراگراف‌ها حتماً خط خالی بگذار.\n"
                                  "6. اصلا کتابی ننویس. انگار داری برای رفیقت ویس می‌فرستی."
                              )
                          },
                          {"role": "user", "content": f"این خبرا رو بگیر و با یه تیتر داغ و لحن مشتی ردیفش کن:\n\n{news_block}"}
                      ]
                  }, timeout=30
              ).json()
              msg = groq["choices"][0]["message"]["content"]
          except: msg = "هوش مصنوعی‌مون رفته مرخصی، فعلا خبری نیست!"

          # فوتر ثابت برای برندینگ
          final_msg = f"{msg}\n\n🔔 @behnews"

          requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": final_msg, "parse_mode": "Markdown"})
          PYEOF
