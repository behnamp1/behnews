name: Behnews Bot Fast Iran

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *' # هر 10 دقیقه چک میکنه که خبر داغ از دست نره

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send Fast News
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re, random

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          # منابع متمرکز روی اخبار داغ و فوری ایران
          SOURCES = [
              "https://www.tasnimnews.com/fa/rss/feed/0/7/1", # سیاسی ایران
              "https://www.isna.ir/rss/tp/1",                 # اخبار اصلی ایران
              "https://www.irna.ir/rss/tp/1",                 # فوری ایرنا
              "https://www.farsnews.ir/rss/politics"          # سیاسی فارس
          ]

          all_news = []
          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=10)
                  items = re.findall(r'<item>(.*?)</item>', resp.text, re.DOTALL)
                  for item in items:
                      title = re.search(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', item).group(1)
                      # فیلتر دقیق‌تر برای پیدا کردن عکس خبر نه لوگوی سایت
                      img_match = re.search(r'<(?:enclosure|media:content).*?url="(.*?)"', item)
                      img_url = img_match.group(1) if img_match else None
                      
                      if len(title) > 30:
                          all_news.append({"title": title, "image": img_url})
              except: continue

          if not all_news: exit()

          # انتخاب یکی از ۳ خبر جدید اول (برای اینکه همیشه داغ‌ترین باشه)
          selected = all_news[0] if all_news else None
          
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system", 
                              "content": (
                                  "تو ادمین یک کانال خبری فوری و رند ایرانی هستی. "
                                  "فقط درباره اخبار ایران بنویس. "
                                  "فرمت: "
                                  "📍 [تیتر خیلی کوتاه و جنجالی خبر]\n\n"
                                  "💬 [اصل خبر به زبان محاوره خیلی صمیمی]\n\n"
                                  "تیکه ادمین: [یک جمله کوتاه، کنایه‌آمیز و رندانه به سبک لاتی تهرانی]\n\n"
                                  "قوانین: فقط فارسی. کلمه انگلیسی ممنوع. حتما به نفع ایران و علیه رقبا تیکه بنداز."
                              )
                          },
                          {"role": "user", "content": f"این خبر داغ ایران رو بترکون: {selected['title']}"}
                      ]
                  }, timeout=30
              ).json()
              msg = groq["choices"][0]["message"]["content"]
          except: exit()

          caption = f"{msg}\n\n🆔 @behnews"

          # ارسال با متد مناسب
          if selected['image'] and "static" not in selected['image']: # جلوگیری از ارسال لوگوهای استاتیک
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendPhoto", json={"chat_id": int(CHAT), "photo": selected['image'], "caption": caption})
          else:
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": caption})
          PYEOF
