name: Behnews Bot Professional

on:
  schedule:
    - cron: '*/30 * * * *' # هر 30 دقیقه اجرا می‌شود
  workflow_dispatch: # امکان اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: ambassadors/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Fetch and Post News
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<EOF
          import requests
          import feedparser
          import os
          import time

          # لیست منابع خبری
          RSS_URLS = [
              "https://www.isna.ir/rss",
              "https://www.irna.ir/rss",
              "https://www.mehrnews.com/rss",
              "https://www.tasnimnews.com/fa/rss/feed/0/7/1",
              "https://www.farsnews.ir/rss"
          ]

          def get_latest_news():
              all_news = []
              for url in RSS_URLS:
                  feed = feedparser.parse(url)
                  for entry in feed.entries[:3]: # از هر منبع 3 خبر آخر
                      all_news.append(f"منبع: {feed.feed.title}\nخبر: {entry.title}")
              return "\n\n".join(all_news)

          def process_with_groq(news_text):
              url = "https://api.groq.com/openai/v1/chat/completions"
              headers = {
                  "Authorization": f"Bearer {os.getenv('GROQ_API_KEY')}",
                  "Content-Type": "application/json"
              }
              prompt = f"این خبرها رو به زبان فارسی خیلی طنز، عامیانه و تیکه دار بازنویسی کن. برای هر خبر یک پاراگراف جدا بنویس و بینشون دو تا خط فاصله بذار. از ایموجی‌های خنده‌دار هم استفاده کن:\n\n{news_text}"
              
              data = {
                  "model": "llama3-8b-8192",
                  "messages": [{"role": "user", "content": prompt}]
              }
              response = requests.post(url, headers=headers, json=data)
              return response.json()['choices'][0]['message']['content']

          def send_to_bale(text):
              url = f"https://tapi.bale.ai/bot{os.getenv('BALE_TOKEN')}/sendMessage"
              data = {
                  "chat_id": os.getenv("CHANNEL_ID"),
                  "text": f"🔔 **تازه چه خبر؟**\n\n{text}\n\n🆔 @Behnews"
              }
              requests.post(url, json=data)

          try:
              raw_news = get_latest_news()
              funny_news = process_with_groq(raw_news)
              send_to_bale(funny_news)
              print("Done!")
          except Exception as e:
              print(f"Error: {e}")
          EOF
