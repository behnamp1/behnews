name: Behnews Bot Iran Clean

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # هر 15 دقیقه چک میکنه

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send Clean News
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          def clean_text(text):
              # فقط حروف فارسی، اعداد، و علائم نگارشی استاندارد اجازه عبور دارند
              allowed_chars = r'[^آ-ی‌أإؤئء0-9 \.\!\?\:\(\)\-\n]'
              text = re.sub(allowed_chars, '', text)
              # حذف کلمات انگلیسی احتمالی
              text = re.sub(r'[a-zA-Z]+', '', text)
              return text.strip()

          SOURCES = [
              "https://www.tasnimnews.com/fa/rss/feed/0/7/1",
              "https://www.isna.ir/rss/tp/1",
              "https://www.irna.ir/rss/tp/1"
          ]

          all_news = []
          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=10)
                  items = re.findall(r'<item>(.*?)</item>', resp.text, re.DOTALL)
                  for item in items:
                      title = re.search(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', item).group(1)
                      img_match = re.search(r'<(?:enclosure|media:content).*?url="(.*?)"', item)
                      img_url = img_match.group(1) if img_match else None
                      if len(title) > 30:
                          all_news.append({"title": title, "image": img_url})
              except: continue

          if not all_news: exit()
          selected = all_news[0]
          
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system", 
                              "content": (
                                  "تو یک روزنامه‌نگار طناز و بسیار حرفه‌ای هستی. "
                                  "وظیفه داری فقط یک خبر مهم درباره ایران را به شکلی کوتاه، صمیمی و کنایه‌آمیز بنویسی. "
                                  "قوانین: ۱- متن باید یکپارچه باشد (تیتر و تیکه ادمین جداگانه نداریم). "
                                  "۲- لحن کاملاً محاوره‌ای تهرانی و بسیار رندانه. "
                                  "۳- فقط فارسی بنویس. از هیچ کاراکتر یا زبان دیگری استفاده نکن. "
                                  "۴- متن نباید بیشتر از ۳ جمله باشد."
                              )
                          },
                          {"role": "user", "content": f"این خبر رو خیلی مشتی و کوتاه تعریف کن: {selected['title']}"}
                      ],
                      "temperature": 0.3 # کمترین خلاقیت برای بیشترین دقت در نگارش
                  }, timeout=30
              ).json()
              msg = groq["choices"][0]["message"]["content"]
              msg = clean_text(msg) # پاکسازی نهایی کاراکترهای عجیب
          except: exit()

          caption = f"📍 {msg}\n\n🆔 @behnews"

          if selected['image'] and "logo" not in selected['image']:
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendPhoto", json={"chat_id": int(CHAT), "photo": selected['image'], "caption": caption})
          else:
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": caption})
          PYEOF
