name: Behnews Bot Final Fix

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send Post
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          def deep_clean(text):
              # ۱. حذف خطوطی که شامل "تیکه ادمین" هستند
              lines = text.split('\n')
              lines = [l for l in lines if "تیکه ادمین" not in l]
              text = '\n'.join(lines)
              
              # ۲. حذف تمام حروف انگلیسی و لاتین (مثل besar و غیره)
              text = re.sub(r'[a-zA-Záéíóúýčďěňřšťžů]+', '', text)
              
              # ۳. حذف کاراکترهای عجیب و غریب غیر از فارسی و علائم اصلی
              text = re.sub(r'[^\u0600-\u06FF0-9\s📍💬🆔@\.\!\?\:\(\)\-\_]', '', text)
              
              return text.strip()

          SOURCES = ["https://www.tasnimnews.com/fa/rss/feed/0/7/1", "https://www.isna.ir/rss/tp/1"]
          
          news_list = []
          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=10)
                  items = re.findall(r'<item>(.*?)</item>', resp.text, re.DOTALL)
                  for item in items[:2]:
                      title = re.search(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', item).group(1)
                      img = re.search(r'<(?:enclosure|media:content).*?url="(.*?)"', item)
                      img_url = img.group(1) if img else None
                      news_list.append({"t": title, "i": img_url})
              except: continue

          if not news_list: exit()
          selected = news_list[0]

          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {"role": "system", "content": "تو یک خبرنگار صمیمی هستی. فقط به زبان فارسی محاوره بنویس. تیتر بزن و متن را کوتاه تعریف کن. به هیچ وجه کلمه انگلیسی یا بخش 'تیکه ادمین' اضافه نکن."},
                          {"role": "user", "content": f"این خبر رو خیلی کوتاه و بدون کلمه اضافی تعریف کن: {selected['t']}"}
                      ],
                      "temperature": 0.2
                  }
              ).json()
              msg = deep_clean(groq["choices"][0]["message"]["content"])
          except: exit()

          full_caption = f"📍 {selected['t']}\n\n💬 {msg}\n\n🆔 @behnews"

          if selected['i'] and "logo" not in selected['i']:
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendPhoto", json={"chat_id": int(CHAT), "photo": selected['i'], "caption": full_caption})
          else:
              requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": full_caption})
          PYEOF
