name: Behnews Bot Professional

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send news
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re
          from datetime import datetime

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          def ask_groq(prompt, system_msg):
              try:
                  resp = requests.post(
                      "https://api.groq.com/openai/v1/chat/completions",
                      headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                      json={
                          "model": "llama-3.3-70b-versatile",
                          "messages": [
                              {"role": "system", "content": system_msg},
                              {"role": "user", "content": prompt}
                          ],
                          "temperature": 0.6
                      }, timeout=30
                  ).json()
                  return resp["choices"][0]["message"]["content"]
              except: return None

          # 1. جمع‌آوری اخبار
          SOURCES = [("تسنیم", "https://www.tasnimnews.com/fa/rss/feed"), ("ایسنا", "https://www.isna.ir/rss"), ("فارس", "https://www.farsnews.ir/rss")]
          all_news = []
          for name, url in SOURCES:
              try:
                  resp = requests.get(url, timeout=10)
                  titles = re.findall(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', resp.text)
                  clean = lambda t: re.sub(r'<[^>]+>', '', t).strip()
                  valid = [clean(t) for t in titles if len(clean(t)) > 30][1:3]
                  all_news.extend(valid)
              except: continue

          if not all_news: exit()

          # 2. مرحله اول: تولید متن طنز
          raw_funny = ask_groq(
              f"از بین این خبرا فقط یکی رو انتخاب کن و یه پست طنز لاتی و تیکه‌دار براش بنویس:\n{all_news[:10]}",
              "تو یک طنزنویس حرفه‌ای هستی. فقط یک خبر را انتخاب کن. تیتر جذاب بزن و زیرش یک پاراگراف صمیمی و محاوره بنویس. فقط فارسی!"
          )

          if not raw_funny: exit()

          # 3. مرحله دوم: بازبینی و اصلاح (سردبیر)
          final_msg = ask_groq(
              f"این متن طنز رو بازبینی کن:\n{raw_funny}",
              "تو سردبیر یک کانال خبری هستی. متن را بررسی کن: ۱- کلمات غیرفارسی و عجیب را حذف کن. ۲- مطمئن شو جای برنده و بازنده در شوخی عوض نشده باشد (مثلا اگر ایران پیروز شده، شوخی نباید علیه ایران باشد). ۳- لحن را صمیمی‌تر کن. ۴- فقط متن اصلاح شده را برگردان."
          )

          if not final_msg: final_msg = raw_funny

          # 4. ارسال به بله
          requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": f"{final_msg}\n\n🆔 @behnews"})
          PYEOF
