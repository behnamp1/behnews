name: Behnews Bot Standard

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Send news
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import requests, os, re

          TOKEN = os.environ["BALE_TOKEN"]
          CHAT = os.environ["CHANNEL_ID"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          # منابع فیلتر شده روی اخبار مهم و فوری سیاسی/داخلی
          SOURCES = [
              "https://www.tasnimnews.com/fa/rss/feed/0/7/1", # سیاسی تسنیم
              "https://www.irna.ir/rss/tp/1",                 # عناوین مهم ایرنا
              "https://www.isna.ir/rss/tp/1",                 # اخبار برگزیده ایسنا
              "https://www.farsnews.ir/rss/politics"          # سیاسی فارس
          ]

          all_news = []
          for url in SOURCES:
              try:
                  resp = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=10)
                  titles = re.findall(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>', resp.text)
                  clean = lambda t: re.sub(r'<[^>]+>', '', t).strip()
                  # فقط خبرهایی که طول کلماتشان نشان‌دهنده یک خبر جدی است
                  valid = [clean(t) for t in titles if len(clean(t)) > 35][1:5]
                  all_news.extend(valid)
              except: continue

          if not all_news: exit()
          news_block = "\n".join(all_news)
          
          try:
              groq = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "llama-3.3-70b-versatile",
                      "messages": [
                          {
                              "role": "system", 
                              "content": (
                                  "تو سردبیر یک کانال خبری تحلیلی و رند هستی. "
                                  "وظیفه: از بین خبرها، فقط 'یک' خبر که دارای ارزش سیاسی، نظامی یا ملی است انتخاب کن. "
                                  "خبرهای زرد، اجتماعی کوچک یا حوادث را حذف کن. "
                                  "فرمت: سطر اول تیتر با 📍 / سطر دوم متن محاوره و کنایه‌آمیز با 💬. "
                                  "قوانین: فقط فارسی سره. بدون کلمه انگلیسی. بدون بخش 'تیکه ادمین'. "
                                  "موضع: همیشه از موضع قدرت ایران و با کنایه به رقبا بنویس."
                              )
                          },
                          {"role": "user", "content": f"مهم‌ترین خبر ایران را از این لیست انتخاب و پست کن:\n\n{news_block}"}
                      ],
                      "temperature": 0.4
                  }, timeout=30
              ).json()
              msg = groq["choices"][0]["message"]["content"]
              msg = re.sub(r'[a-zA-Z]+', '', msg).strip()
              msg = msg.replace("تیکه ادمین:", "").replace("تیکه ادمین", "")
          except: exit()

          requests.post(f"https://tapi.bale.ai/bot{TOKEN}/sendMessage", json={"chat_id": int(CHAT), "text": f"{msg}\n\n🆔 @behnews"})
          PYEOF
